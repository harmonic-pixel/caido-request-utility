[project]
name = "skelmis-cru"
description = "A utility helper for working with Caido request exports"
authors = [{ name = "skelmis", email = "skelmis.craft@gmail.com" }]
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "idox>=1.6.0",
    "pypika>=0.51.1",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "defusedxml>=0.7.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "ty>=0.0.38",
]

[project.urls]
"Issue tracker" = "https://github.com/Skelmis/caido-request-utility/issues"
Homepage = "https://github.com/Skelmis/caido-request-utility"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["cru"]

[tool.hatch.build.targets.wheel]
include = ["cru"]

[tool.ruff.lint.per-file-ignores]
# Row dicts are built from dict(...) kwargs on purpose: the row shape reads as
# data that way. Literals would be noisier, not clearer.
"tests/*.py" = ["C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
